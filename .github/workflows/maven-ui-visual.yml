name: Advisory JavaFX Visual Suite

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  ui-visual:
    name: JavaFX visual tests (advisory, Windows, Java 21)
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run advisory rendered JavaFX tests
        run: mvn -Pui-visual test
      - name: Report advisory failures
        if: failure()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY '## Advisory JavaFX visual failures'
          Add-Content $env:GITHUB_STEP_SUMMARY 'Rendered UI checks failed. This result is informational and does not block pull requests or releases.'
          [Console]::WriteLine('::warning title=Advisory JavaFX visual suite failed::Review the archived reports and inspect the affected UI visually.')
      - name: Archive visual test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 30
