name: Temporary Phase 3B.7 affected selector closeout
# Explicit task-authorized one-off testing; remove before merge.
on:
  push:
    branches: [codex/phase-3b7-affected-closeout]
permissions:
  contents: read
jobs:
  affected:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Remaining selector-required auth and runtime classes
        run: |
          mkdir -p work/mcp-evidence
          set -o pipefail
          timeout 480 mvn -B -ntp -pl shale-data -am -Dtest=AuthCredentialLookupTest,PreTenantAuthenticationModuleContractTest,RuntimeSessionServiceTimingTest -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 | tee work/mcp-evidence/selector-closeout.log
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-phase3b7-selector-closeout
          retention-days: 14
          path: |
            work/mcp-evidence/
            **/target/surefire-reports/
