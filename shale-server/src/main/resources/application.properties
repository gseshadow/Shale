spring.application.name=shale-server
server.port=${PORT:8080}
logging.level.root=INFO
logging.level.com.shale=INFO

# Preserve Boot 3 JSON contracts while using Boot 4's managed Jackson 3 mapper.
spring.jackson.use-jackson2-defaults=true

# Retain the published OpenAPI 3.0 nullable/schema contract.
springdoc.api-docs.version=OPENAPI_3_0

# 3B.2A foundation only. Even opt-in internal composition cannot issue AI credentials.
shale.ai.oauth.composition-enabled=false
# No public-origin default; set shale.ai.oauth.public-origin to a canonical origin without a slash.
# Identity defaults to PRODUCTION. Dev/test need their own reserved/loopback origin and active profile.

# Authorization/code lifecycle only; SQL global and tenant gates independently remain default OFF.
shale.ai.oauth.authorization-enabled=false

# Opaque code/refresh issuance is separately opt-in; no Shale resource accepts these tokens yet.
shale.ai.oauth.exchange-enabled=false


# MCP transport is independent of OAuth and remains explicitly OFF.
shale.ai.mcp.enabled=false
shale.ai.mcp.search-cases-enabled=false
shale.ai.enabled=false
# No allowed Origin default. Nonbrowser callers may omit Origin.
# SDK parser logs raw JSON at DEBUG; never enable its payload logger.
logging.level.io.modelcontextprotocol.modern.JsonRpc=OFF

# Independent handler switch; production additionally requires explicit SQL composition readiness.
shale.ai.mcp.get-case-overview-enabled=false

# SQL readiness only; never enables OAuth, transport, handlers or database/tenant capability.
shale.ai.mcp.case-data-composition-enabled=false
